[project]
name = "s3browser"
version = "0.1.8"
description = "S3-compatible browser with an installable FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.7.0,<3.8.0",
    "cryptography>=46.0.0,<49.0.0",
    "fastapi>=0.136.1,<0.137.0",
    "filelock>=3.29.0,<4.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27,<0.0.28",
    "uvicorn[standard]>=0.46.0,<0.48.0",
]

[project.scripts]
s3browser = "s3browser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s3browser"]
force-include = { "dist" = "s3browser/static" }

[tool.hatch.build.targets.sdist]
force-include = { "dist" = "dist" }

[dependency-groups]
dev = [
    "basedpyright>=1.39.3,<1.40.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12,<0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "dist", "dist-server", "node_modules"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF029",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.basedpyright]
include = ["s3browser"]
exclude = [".venv", "dist", "dist-server", "node_modules", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
norecursedirs = ["tmp"]
pythonpath = ["."]
