name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold

      # build.rs builds and embeds the frontend in every build.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: CLI smoke test
        run: cargo run --locked -- --help

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold

      # build.rs builds and embeds the frontend in every build.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache Silo
        uses: actions/cache@v4
        with:
          path: tmp/tools
          key: silo-${{ runner.arch }}-${{ hashFiles('scripts/e2e.sh') }}

      - name: End-to-end tests (Silo S3)
        run: ./scripts/e2e.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bun run lint --reporter=rdjson

      - name: TypeScript
        run: bun run typecheck

      - name: Frontend build
        run: bun run build
